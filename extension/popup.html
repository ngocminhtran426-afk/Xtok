<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>xNhau Bypasser</title>
  <style>
    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 15px;
      background: #121212;
      color: #fff;
    }
    .status {
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }
    .status.active {
      background: #4caf50;
      color: white;
    }
    .status.inactive {
      background: #f44336;
      color: white;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      text-align: center;
      color: #fe2c55;
    }
    p {
      font-size: 13px;
      line-height: 1.4;
      color: #aaa;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #fe2c55;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background: #e6284d;
    }
  </style>
</head>
<body>
  <h2>xNhau Bypasser</h2>
  <p>Extension này giúp Tiktok UI vượt qua Cloudflare khi chạy trên nền tảng Web.</p>
      <div id="statusBox" class="status inactive">Đang kiểm tra...</div>
      
      <div id="debugBox" style="font-size: 10px; color: #888; margin: 10px 0; word-break: break-all;"></div>
      
      <button id="btnBypass" class="btn">
        Mở trang mồi Cloudflare
      </button>

  <script src="popup.js"></script>
</body>
</html>
