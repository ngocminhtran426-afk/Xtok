<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>xNhau Bypasser</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 15px;
      background: #121212;
      color: #fff;
      margin: 0;
    }
    .status {
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
      text-align: center;
      font-weight: bold;
    }
    .status.active {
      background: #4caf50;
      color: white;
    }
    .status.inactive {
      background: #f44336;
      color: white;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      text-align: center;
      color: #fe2c55;
    }
    p {
      font-size: 13px;
      line-height: 1.4;
      color: #aaa;
    }
    button {
      width: 100%;
      padding: 8px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
      font-size: 13px;
    }
    .btn-primary {
      background: #fe2c55;
    }
    .btn-primary:hover {
      background: #e6284d;
    }
    .btn-secondary {
      background: #333;
      font-weight: normal;
    }
    .btn-secondary:hover {
      background: #444;
    }
    .btn-save {
      background: #4caf50;
    }
    .btn-save:hover {
      background: #43a047;
    }

    /* Settings panel */
    .settings-panel {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .settings-panel.show {
      display: block;
    }
    .settings-panel h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #fe2c55;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      color: #888;
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
      padding: 6px 8px;
      background: #1e1e1e;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    .form-group input:focus {
      border-color: #fe2c55;
      outline: none;
    }
    .save-msg {
      font-size: 11px;
      color: #4caf50;
      text-align: center;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <h2>xNhau Bypasser</h2>
  <p>Extension giúp vượt Cloudflare khi xem video trên XTok Web.</p>
  
  <div id="statusBox" class="status inactive">Đang kiểm tra...</div>
  
  <div id="debugBox" style="font-size: 10px; color: #888; margin: 10px 0; word-break: break-all;"></div>
  
  <button id="btnBypass" class="btn-primary">
    🔓 Mở trang mồi Cloudflare
  </button>
  
  <button id="btnSettings" class="btn-secondary">
    ⚙️ Cài đặt tên miền
  </button>

  <div id="settingsPanel" class="settings-panel">
    <h3>⚙️ Cấu hình tên miền</h3>
    <div class="form-group">
      <label>Tên miền chính (embed/video):</label>
      <input type="text" id="inputDomain" placeholder="VD: xnhau.pics">
    </div>
    <div class="form-group">
      <label>URL trang mồi (để xác minh CF):</label>
      <input type="text" id="inputBaitUrl" placeholder="VD: https://xnhau.pics/embed/37851">
    </div>
    <button id="btnSave" class="btn-save">💾 Lưu cài đặt</button>
    <div id="saveMsg" class="save-msg">✅ Đã lưu! Extension sẽ dùng tên miền mới.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
